---

- name: OCUDU split exporter (CU/DU metrics)
  hosts: ocudu_nodes
  gather_facts: true

  vars_files:
    - "vars/main.yml"

  environment: "{{ proxy_env }}"

  roles:
    - ocudu-exporter

- name: split monitoring (ServiceMonitor + Grafana dashboard)
  hosts: master_nodes
  gather_facts: true

  vars_files:
    - "vars/main.yml"

  environment: "{{ proxy_env }}"

  roles:
    - monitor-load-split
