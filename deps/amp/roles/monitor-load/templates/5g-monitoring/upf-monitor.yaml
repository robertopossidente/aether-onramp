apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: upf
  namespace: aether-5gc
spec:
  endpoints:
    - path: /metrics
      port: prometheus-exporter
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          regex: "aether-5gc"
          targetLabel: upf
          replacement: "aether-upf-0"
        - sourceLabels: [__meta_kubernetes_namespace]
          regex: "(aether-upf-.*)"
          targetLabel: upf
          replacement: "$1"
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: upf
