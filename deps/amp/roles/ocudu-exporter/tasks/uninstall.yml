---

- name: stop and disable exporter
  systemd:
    name: ocudu-exporter
    state: stopped
    enabled: false
  become: true
  failed_when: false
  when: ansible_service_mgr == 'systemd'

- name: remove exporter files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ocudu-exporter.service
    - "{{ ocudu_exporter_dir }}"
  become: true

- name: stop exporter without systemd
  command: pkill -f "[o]cudu_exporter.py"
  become: true
  failed_when: false
  when: ansible_service_mgr != 'systemd'

- name: reload systemd
  systemd:
    daemon_reload: true
  become: true
  when: ansible_service_mgr == 'systemd'
