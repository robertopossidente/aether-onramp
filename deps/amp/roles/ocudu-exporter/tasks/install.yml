---

- name: create exporter directory
  file:
    path: "{{ ocudu_exporter_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: install exporter script
  copy:
    src: ocudu_exporter.py
    dest: "{{ ocudu_exporter_dir }}/ocudu_exporter.py"
    mode: "0755"
  become: true
  register: ocudu_exporter_script

- name: install exporter systemd unit
  template:
    src: ocudu-exporter.service.j2
    dest: /etc/systemd/system/ocudu-exporter.service
    mode: "0644"
  become: true
  register: ocudu_exporter_unit
  when: ansible_service_mgr == 'systemd'

- name: enable and start exporter
  systemd:
    name: ocudu-exporter
    state: "{{ 'restarted' if (ocudu_exporter_script.changed or ocudu_exporter_unit.changed) else 'started' }}"
    enabled: true
    daemon_reload: true
  become: true
  when: ansible_service_mgr == 'systemd'

# Node containers have no systemd: run the exporter as a detached process.
- name: stop previous exporter without systemd
  command: pkill -f "[o]cudu_exporter.py"
  become: true
  failed_when: false
  changed_when: false
  when: ansible_service_mgr != 'systemd'

- name: start exporter without systemd
  shell: >-
    nohup setsid /usr/bin/python3 {{ ocudu_exporter_dir }}/ocudu_exporter.py
    --listen {{ ocudu_exporter_bind }} --port {{ ocudu_exporter_port }}
    --cu-container {{ ocudu_exporter_cu_container }} --du-container {{ ocudu_exporter_du_container }}
    --du-ws-host 127.0.0.1 --du-ws-port {{ ocudu_exporter_du_ws_port }}
    > /var/log/ocudu-exporter.log 2>&1 < /dev/null &
  become: true
  when: ansible_service_mgr != 'systemd'
  changed_when: true

- name: wait for exporter port
  wait_for:
    host: 127.0.0.1
    port: "{{ ocudu_exporter_port }}"
    timeout: 30
