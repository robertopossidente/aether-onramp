---

- name: OCUDU split exporter for orchestrated nodes (CU/DU metrics)
  hosts:
    - ocu_nodes
    - odu_nodes
  gather_facts: true

  vars_files:
    - "vars/main.yml"
    - "{{ playbook_dir }}/../../vars/main.yml"

  environment: "{{ proxy_env }}"

  roles:
    - ocudu-exporter

- name: orchestrated split monitoring (ServiceMonitor + Grafana dashboard)
  hosts: master_nodes
  gather_facts: true

  vars_files:
    - "vars/main.yml"
    - "{{ playbook_dir }}/../../vars/main.yml"

  environment: "{{ proxy_env }}"

  roles:
    - monitor-load-orch
