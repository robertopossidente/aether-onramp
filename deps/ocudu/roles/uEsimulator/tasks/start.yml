---

- name: resolve instance suffix
  ansible.builtin.set_fact:
    instance_suffix: "{{ ocudu.servers[groups['ocudu_nodes'].index(inventory_hostname)].instance_suffix | default('') }}"
  when: inventory_hostname in groups['ocudu_nodes']

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and ocudu nodes: {{ ocudu.servers|length }} vs {{ groups['ocudu_nodes']|length }}"
  when: ocudu.servers|length != groups['ocudu_nodes']|length

- name: check if simulation is enabled else abort
  fail:
    msg: "Simulation is not enabled"
  when: ocudu.simulation == false

- name: ensure {{ ocudu.docker.container.ue_image }} image is present
  # `source: local` reuses the image staged into Docker by the
  # bundle's dockerimages step. Online installs still pull so
  # operators can refresh tags out-of-band.
  community.docker.docker_image:
    name: "{{ ocudu.docker.container.ue_image }}"
    source: "{{ 'local' if airgapped.enabled | default(false) | bool else 'pull' }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: remove /tmp/ue_zmq{{ instance_suffix }}.conf
  file:
    path: "/tmp/ue_zmq{{ instance_suffix }}.conf"
    state: absent
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name : copy ue_zmq config file to /tmp/ue_zmq{{ instance_suffix }}.conf
  template:
    src: "{{ ocudu.servers[server_index | int].ue_conf }}"
    dest: /tmp/ue_zmq{{ instance_suffix }}.conf
  vars:
    server_index: "{{ groups['ocudu_nodes'].index(inventory_hostname) }}"
    zmq_port: "{{ ocudu.servers[server_index | int].zmq_port | default(2000) }}"
    ue_imsi: "{{ (ocudu.servers[server_index | int].ue | default({})).imsi | default('%015d' | format(1010100007500 + (server_index | int))) }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: remove existing {{ ocudu.docker.container.ue_image }} container before starting
  community.docker.docker_container:
    name: "rfsim5g-nr-ue{{ instance_suffix }}"
    state: absent
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: check if split DU container is running
  community.docker.docker_container_info:
    name: "ocudu-du{{ instance_suffix }}"
  register: split_du_info
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: restart split DU container so ZMQ radio accepts the new UE session
  community.docker.docker_container:
    name: "ocudu-du{{ instance_suffix }}"
    state: started
    restart: true
  when:
    - inventory_hostname in groups['ocudu_nodes']
    - split_du_info.exists | default(false)
    - split_du_info.container.State.Running | default(false)
  become: true

- name: wait for split DU F1 setup after restart
  pause:
    seconds: 3
  when:
    - inventory_hostname in groups['ocudu_nodes']
    - split_du_info.exists | default(false)
    - split_du_info.container.State.Running | default(false)

- name: create {{ ocudu.docker.container.ue_image }} containers
  community.docker.docker_container:
    name: "rfsim5g-nr-ue{{ instance_suffix }}"
    image: "{{ ocudu.docker.container.ue_image }}"
    recreate: true
    networks:
      - name: "{{ ocudu.docker.network.name }}"
    volumes:
      - /tmp/ue_zmq{{ instance_suffix }}.conf:/opt/ue_zmq.conf
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true
    capabilities:
    - NET_ADMIN
    - NET_RAW
    restart_policy: unless-stopped
    state: started
    detach: true
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: wait for UE tunnel interface
  community.docker.docker_container_exec:
    container: "rfsim5g-nr-ue{{ instance_suffix }}"
    command: "ip netns exec ue1 ip link show tun_srsue"
  register: ocudu_ue_tunnel
  retries: 60
  delay: 2
  until: ocudu_ue_tunnel.rc == 0
  changed_when: false
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: add default route for UE
  community.docker.docker_container_exec:
    container: "rfsim5g-nr-ue{{ instance_suffix }}"
    command: >-
      ip netns exec ue1 ip route replace default via
      {{ (core.upf.default_upf.ue_ip_pool.split('.'))[:3] | join('.') }}.{{ (core.upf.default_upf.ue_ip_pool.split('.')[3] | int) + 1 }}
      dev tun_srsue
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- set_fact:
    ping_target: "{{ core.upf.core_subnet | regex_replace('(/.*$)', '') }}"
  when: inventory_hostname in groups['ocudu_nodes']

- name: run ping command to check if the UE is running and show output
  community.docker.docker_container_exec:
    container: "rfsim5g-nr-ue{{ instance_suffix }}"
    command: "ip netns exec ue1 ping -c 5 {{ ping_target }}"
  register: uEsimPingOutput
  changed_when: false
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- debug:
    var: uEsimPingOutput.stdout_lines
  when: inventory_hostname in groups['ocudu_nodes']
