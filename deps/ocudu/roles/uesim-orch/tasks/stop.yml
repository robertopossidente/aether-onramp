---

- name: resolve UE instances targeting this host
  ansible.builtin.set_fact:
    target_ues: >-
      {{
        ocudu_orch.ues | default({}) | dict2items
        | selectattr('value.target_host', 'equalto', inventory_hostname)
        | list
      }}

- name: stop UE containers
  community.docker.docker_container:
    name: "rfsim5g-nr-ue-{{ item.key }}"
    state: absent
  loop: "{{ target_ues }}"
  become: true

- name: remove UE configs
  ansible.builtin.file:
    path: "/tmp/ue_zmq_{{ item.key }}.conf"
    state: absent
  loop: "{{ target_ues }}"
  become: true

