gnb_id: {{ gnb_id }}

cu_cp:
  amf:
    addrs: "{{ core.amf.ip }}"
    bind_addrs: "{{ gnb_ip }}"
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200
  # The SD-Core needs more than the 3 s default to answer the PDU session request
  request_pdu_session_timeout: {{ request_pdu_session_timeout }}
  f1ap:
    bind_addrs: "{{ cu_f1_addr }}"

cu_up:
  ngu:
    socket:
      - bind_addr: "{{ gnb_ip }}"
        ext_addr: "{{ gnb_ip }}"
  f1u:
    socket:
      - bind_addr: "{{ cu_f1_addr }}"

log:
  filename: stdout
  all_level: info

# CU metrics are printed to the container log ([METRICS] lines) because the
# ocu binary has no JSON/remote-control gateway; the DU serves JSON through the
# local remote control WebSocket (command metrics_subscribe). Both are consumed
# by the AMP ocudu-exporter.
metrics:
  enable_log: true
  layers:
    enable_ngap: true
    enable_rrc: true
    enable_pdcp: true
    enable_e1ap: true
  periodicity:
    cu_cp_report_period: 1000
    cu_up_report_period: 1000

pcap:
  ngap_enable: false
  f1ap_enable: false
