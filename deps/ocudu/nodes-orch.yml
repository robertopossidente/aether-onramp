---

# Creates orchestrated nodes (every host in [orch_nodes]) as Docker-in-Docker containers
# on the master node. Container name = inventory hostname, container IP = ansible_host.

- name: simulate orchestrated OCUDU nodes as containers
  hosts: master_nodes
  gather_facts: false
  run_once: true

  vars_files:
    - "vars/main.yml"
    - "{{ playbook_dir }}/../../vars/main.yml"

  vars:
    nc: "{{ (ocudu_orch.node_containers if ocudu_orch is defined and ocudu_orch.node_containers is defined else ocudu.node_containers) }}"
    all_node_names: "{{ groups['orch_nodes'] | default(groups['ocu_nodes'] | default([]) + groups['odu_nodes'] | default([]) + groups['uesim_nodes'] | default([])) | unique }}"
    node_names: >-
      {{
        (ocudu_target_nodes.split(',') | map('trim') | reject('equalto', '') | list)
        if (ocudu_target_nodes is defined and (ocudu_target_nodes | trim | length > 0))
        else all_node_names
      }}
    gnb_images:
      - "{{ (ocudu_orch.docker.container.gnb_image if ocudu_orch is defined and ocudu_orch.docker is defined else ocudu.docker.container.gnb_image) }}"
      - "{{ (ocudu_orch.docker.container.ue_image if ocudu_orch is defined and ocudu_orch.docker is defined else ocudu.docker.container.ue_image) }}"
    cu_image: "{{ (ocudu_orch.docker.container.cu_image if (ocudu_orch is defined and ocudu_orch.docker is defined and ocudu_orch.docker.container.cu_image is defined) else (ocudu_orch.docker.container.gnb_image if (ocudu_orch is defined and ocudu_orch.docker is defined) else 'aetherproject/ocu:rel-1.0.0')) }}"
    du_image: "{{ (ocudu_orch.docker.container.du_image if (ocudu_orch is defined and ocudu_orch.docker is defined and ocudu_orch.docker.container.du_image is defined) else (ocudu_orch.docker.container.gnb_image if (ocudu_orch is defined and ocudu_orch.docker is defined) else 'aetherproject/odu:rel-1.0.0')) }}"
    ue_image: "{{ (ocudu_orch.docker.container.ue_image if (ocudu_orch is defined and ocudu_orch.docker is defined and ocudu_orch.docker.container.ue_image is defined) else 'aetherproject/srsran-ue:rel-1.0.0') }}"
    node_images:
      ocu: "{{ (ocudu_orch.node_containers.images.ocu if (ocudu_orch is defined and ocudu_orch.node_containers is defined and ocudu_orch.node_containers.images is defined and ocudu_orch.node_containers.images.ocu is defined) else 'aether-ocu-node:latest') }}"
      odu: "{{ (ocudu_orch.node_containers.images.odu if (ocudu_orch is defined and ocudu_orch.node_containers is defined and ocudu_orch.node_containers.images is defined and ocudu_orch.node_containers.images.odu is defined) else 'aether-odu-node:latest') }}"
      uesim: "{{ (ocudu_orch.node_containers.images.uesim if (ocudu_orch is defined and ocudu_orch.node_containers is defined and ocudu_orch.node_containers.images is defined and ocudu_orch.node_containers.images.uesim is defined) else 'aether-ue-node:latest') }}"
    preload_pairs: >-
      {{
        (
          ((node_names | intersect(groups['ocu_nodes'] | default([]))) | product([cu_image]) | list) +
          ((node_names | intersect(groups['odu_nodes'] | default([]))) | product([du_image]) | list) +
          ((node_names | intersect(groups['uesim_nodes'] | default([]))) | product([ue_image]) | list) +
          ((node_names | difference((groups['ocu_nodes'] | default([])) + (groups['odu_nodes'] | default([])) + (groups['uesim_nodes'] | default([])))) | product(gnb_images) | list)
        ) | unique | list
      }}
    access_net: "{{ core.upf.access_subnet | ansible.utils.ipaddr('network/prefix') }}"
    pod_net: "{{ nc.pod_cidr | default('10.42.0.0/16') }}"

  tasks:
    - name: node containers must be enabled
      ansible.builtin.assert:
        that: nc.enabled | default(false) | bool
        fail_msg: "Set ocudu_orch.node_containers.enabled: true to simulate the OCUDU nodes as containers"
      tags: [up, down]

    - name: validate node addresses
      ansible.builtin.assert:
        that:
          - item in all_node_names
          - hostvars[item].ansible_host | default('') | length > 0
          - hostvars[item].ansible_host | ansible.utils.ipaddr(nc.network.subnet) | length > 0
          - hostvars[item].ansible_host != nc.network.gateway
        fail_msg: >-
          {{ item }}: ansible_host must lie inside {{ nc.network.subnet }} (not the gateway {{ nc.network.gateway }})
      loop: "{{ node_names }}"
      tags: [up]

    - name: build node image
      community.docker.docker_image:
        name: "{{ nc.image }}"
        source: build
        build:
          path: "{{ playbook_dir }}/nodes"
        force_source: false
      tags: [up]

    - name: build specialized node images
      community.docker.docker_image:
        name: "{{ item.name }}"
        source: build
        build:
          path: "{{ playbook_dir }}/nodes"
          dockerfile: "{{ item.dockerfile }}"
        force_source: false
      loop:
        - { name: "{{ node_images.ocu }}", dockerfile: "Dockerfile.ocu" }
        - { name: "{{ node_images.odu }}", dockerfile: "Dockerfile.odu" }
        - { name: "{{ node_images.uesim }}", dockerfile: "Dockerfile.ue" }
      tags: [up]

    - name: check if specialized O-CU Dockerfile exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/images/ocu/Dockerfile"
      register: ocu_dockerfile
      tags: [up]

    - name: build specialized O-CU image if Dockerfile exists
      community.docker.docker_image:
        name: "{{ cu_image }}"
        source: build
        build:
          path: "{{ playbook_dir }}/images/ocu"
        force_source: false
      when: ocu_dockerfile.stat.exists | default(false)
      tags: [up]

    - name: check if specialized O-DU Dockerfile exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/images/odu/Dockerfile"
      register: odu_dockerfile
      tags: [up]

    - name: build specialized O-DU image if Dockerfile exists
      community.docker.docker_image:
        name: "{{ du_image }}"
        source: build
        build:
          path: "{{ playbook_dir }}/images/odu"
        force_source: false
      when: odu_dockerfile.stat.exists | default(false)
      tags: [up]

    - name: create node network
      community.docker.docker_network:
        name: "{{ nc.network.name }}"
        driver: bridge
        ipam_config:
          - subnet: "{{ nc.network.subnet }}"
            gateway: "{{ nc.network.gateway }}"
      become: true
      tags: [up]

    - name: create node containers
      community.docker.docker_container:
        name: "{{ item }}"
        hostname: "{{ item }}"
        image: >-
          {{
            node_images.ocu if (item in (groups['ocu_nodes'] | default([])))
            else (
              node_images.odu if (item in (groups['odu_nodes'] | default([])))
              else (
                node_images.uesim if (item in (groups['uesim_nodes'] | default([])))
                else nc.image
              )
            )
          }}
        privileged: true
        restart_policy: unless-stopped
        state: started
        networks:
          - name: "{{ nc.network.name }}"
            ipv4_address: "{{ hostvars[item].ansible_host }}"
        volumes:
          - "{{ item }}-docker:/var/lib/docker"
        env:
          NODE_USER: "{{ hostvars[item].ansible_user | default('aether') }}"
          NODE_PASSWORD: "{{ hostvars[item].ansible_password | default('aether') }}"
      loop: "{{ node_names }}"
      become: true
      tags: [up]

    - name: allow N3 between the node network and the UPF access network
      ansible.builtin.iptables:
        chain: DOCKER-USER
        source: "{{ item.src }}"
        destination: "{{ item.dst }}"
        jump: ACCEPT
        action: insert
        rule_num: 1
        comment: aether-ocudu-nodes
      loop:
        - { src: "{{ nc.network.subnet }}", dst: "{{ access_net }}" }
        - { src: "{{ access_net }}", dst: "{{ nc.network.subnet }}" }
        - { src: "{{ pod_net }}", dst: "{{ nc.network.subnet }}" }
      become: true
      tags: [up]

    - name: bypass Docker direct-access drop for UPF access network and pod network
      ansible.builtin.iptables:
        table: raw
        chain: PREROUTING
        source: "{{ item }}"
        destination: "{{ nc.network.subnet }}"
        jump: ACCEPT
        action: insert
        rule_num: 1
        comment: aether-ocudu-nodes
      loop: ["{{ access_net }}", "{{ pod_net }}"]
      become: true
      tags: [up]

    - name: do not masquerade node traffic towards the UPF access network
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ nc.network.subnet }}"
        destination: "{{ access_net }}"
        jump: RETURN
        action: insert
        rule_num: 1
        comment: aether-ocudu-nodes
      become: true
      tags: [up]

    - name: wait for SSH on the nodes
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        search_regex: OpenSSH
        timeout: 120
      loop: "{{ node_names }}"
      tags: [up]

    - name: wait for the Docker daemon inside the nodes
      ansible.builtin.command: docker exec {{ item }} docker info
      register: node_dockerd
      retries: 30
      delay: 2
      until: node_dockerd.rc == 0
      changed_when: false
      loop: "{{ node_names }}"
      become: true
      tags: [up]

    - name: preload specialized OCUDU images into the nodes
      ansible.builtin.shell: |
        set -o pipefail
        docker image inspect {{ item.1 }} >/dev/null 2>&1 || exit 0
        docker exec {{ item.0 }} docker image inspect {{ item.1 }} >/dev/null 2>&1 && exit 0
        docker save {{ item.1 }} | docker exec -i {{ item.0 }} docker load
      args:
        executable: /bin/bash
      register: preload
      changed_when: "'Loaded image' in preload.stdout"
      loop: "{{ preload_pairs }}"
      become: true
      tags: [up]

    - name: remove node containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        keep_volumes: "{{ not (purge_volumes | default(false) | bool) }}"
      loop: "{{ node_names }}"
      become: true
      tags: [down]

    - name: remove node image volumes
      community.docker.docker_volume:
        name: "{{ item }}-docker"
        state: absent
      loop: "{{ node_names }}"
      when: purge_volumes | default(false) | bool
      become: true
      tags: [down]

    - name: check remaining node containers
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: "{{ all_node_names }}"
      register: remaining_node_containers
      become: true
      tags: [down]

    - name: set whether any node container is still present
      ansible.builtin.set_fact:
        any_node_container_remaining: >-
          {{
            (remaining_node_containers.results | default([])
             | selectattr('exists', 'defined')
             | selectattr('exists')
             | list | length) > 0
          }}
      tags: [down]

    - name: remove node network
      community.docker.docker_network:
        name: "{{ nc.network.name }}"
        state: absent
      when: not (any_node_container_remaining | default(false) | bool)
      become: true
      tags: [down]

    - name: remove N3 forwarding rules
      ansible.builtin.iptables:
        chain: DOCKER-USER
        source: "{{ item.src }}"
        destination: "{{ item.dst }}"
        jump: ACCEPT
        comment: aether-ocudu-nodes
        state: absent
      loop:
        - { src: "{{ nc.network.subnet }}", dst: "{{ access_net }}" }
        - { src: "{{ access_net }}", dst: "{{ nc.network.subnet }}" }
        - { src: "{{ pod_net }}", dst: "{{ nc.network.subnet }}" }
      when: not (any_node_container_remaining | default(false) | bool)
      become: true
      tags: [down]

    - name: remove raw PREROUTING bypass
      ansible.builtin.iptables:
        table: raw
        chain: PREROUTING
        source: "{{ item }}"
        destination: "{{ nc.network.subnet }}"
        jump: ACCEPT
        comment: aether-ocudu-nodes
        state: absent
      loop: ["{{ access_net }}", "{{ pod_net }}"]
      when: not (any_node_container_remaining | default(false) | bool)
      become: true
      tags: [down]

    - name: remove masquerade exemption
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ nc.network.subnet }}"
        destination: "{{ access_net }}"
        jump: RETURN
        comment: aether-ocudu-nodes
        state: absent
      loop: ["{{ access_net }}"]
      when: not (any_node_container_remaining | default(false) | bool)
      become: true
      tags: [down]

