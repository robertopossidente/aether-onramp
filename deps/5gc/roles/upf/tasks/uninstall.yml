---

- name: delete route for upf to UE
  command:
    argv:
      - ip
      - route
      - del
      - "{{ item.value.ue_ip_pool }}"
      - via
      - "{{ item.value.ip.core }}"
  when: inventory_hostname in groups['master_nodes']
  with_dict: "{{ core.upf.additional_upfs | default({}) }}"
  become: true
  ignore_errors: yes

- name: remove NAT for upf traffic
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ item.value.ue_ip_pool }}"
    out_interface: "{{ core.data_iface }}"
    jump: MASQUERADE
    state: absent
  when: inventory_hostname in groups['master_nodes'] and core.data_iface is defined and core.data_iface != ''
  with_dict: "{{ core.upf.additional_upfs | default({}) }}"
  become: true
  ignore_errors: yes

- name: verify helm prerequisites for 5gc/upf uninstall
  import_role:
    name: preflight
    tasks_from: helm.yml

- name: verify kubeconfig prerequisites for 5gc/upf uninstall
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: 5GC UPF
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or install 5GC core with a valid
      kubeconfig_source so the cluster context is bootstrapped.

- name: remove aether upfs
  kubernetes.core.helm:
    name: bess-upf
    release_namespace: aether-upf-{{ item.key }}
    state: absent
    wait: true
  with_dict: "{{ core.upf.additional_upfs | default({}) }}"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: remove stale custom.metrics APIService if broken
  command: kubectl delete apiservice v1beta1.custom.metrics.k8s.io --ignore-not-found
  when: inventory_hostname in groups['master_nodes']
  failed_when: false

- name: delete namespace aether-upf
  command:
    argv:
      - kubectl
      - delete
      - namespace
      - "aether-upf-{{ item.key }}"
      - --timeout=60s
  with_dict: "{{ core.upf.additional_upfs | default({}) }}"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

