core:
  # Empty = auto-derive from default-route interface at install time.
  data_iface: ""
  values_file: "roles/core/templates/sdcore-5g-values.yaml"
  ran_subnet: "" # set it to empty to get subnet from 'data_iface'
  webui:
    service_type: ClusterIP
    node_ports:
      metrics: 30808
      http: 30500
      rest: 30501

  helm:
    local_charts: false
    chart_ref: oci://ghcr.io/omec-project/sd-core
    chart_version: 5.0.0 # Ignored if using local charts (local_charts: true)
