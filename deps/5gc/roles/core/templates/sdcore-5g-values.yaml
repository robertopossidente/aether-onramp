# Disable 4G Control Plane
omec-control-plane:
  enable4G: false

# Disable 5G RAN Simulator
5g-ran-sim:
  enable: false

# Override values for 5g-control-plane Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/5g-control-plane/values.yaml
5g-control-plane:
  enable5G: true
  nodeSelectors:
    enabled: false
  # refer to above Helm Chart to add other NF images
  # images:
  #   repository: ""
  #   tags:
  #     amf: <amf image tag>

  kafka:
    deploy: true
    clusterId: {{ kafka_cluster_id | default('Ks229z0SBeqI0rox7jxQTn') | quote }}
    # Enable nodeSelector if needed to control where to deploy the kafka instance(s)
    # controller:
    #   nodeSelector:
    #     node-role.aetherproject.org/5gc: "true"

  mongodb:
    usePassword: false
    persistence:
      enabled: false
    architecture: replicaset
    # Override core.mongodb.replicaCount/resources (e.g., from CI) to shrink the
    # footprint on constrained runners; when unset this template falls back to 2.
    replicaCount: {{ core.get('mongodb', {}).get('replicaCount', 2) }}
{% set mdb_requests = core.get('mongodb', {}).get('resources', {}).get('requests', {}) %}
{% set mdb_limits = core.get('mongodb', {}).get('resources', {}).get('limits', {}) %}
{% if mdb_requests.get('cpu') and mdb_requests.get('memory') and mdb_limits.get('cpu') and mdb_limits.get('memory') %}
    resourcesPreset: "none"
    resources:
      requests:
        cpu: {{ mdb_requests.cpu }}
        memory: {{ mdb_requests.memory }}
      limits:
        cpu: {{ mdb_limits.cpu }}
        memory: {{ mdb_limits.memory }}
{% endif %}
    # Enable nodeSelector if needed to control where to deploy the mongodb instances
    # nodeSelector:
    #   node-role.aetherproject.org/5gc: "true"
    # arbiter:
    #   nodeSelector:
    #     node-role.aetherproject.org/5gc: "true"

  resources:
    enabled: false

  config:
    # logger:
    #   Util:
    #     debugLevel: warn
    #   AMF:
    #     debugLevel: debug
    #   SMF:
    #     debugLevel: debug

    mongodb:
      name: aether
      url: mongodb://mongodb-headless:27017/?replicaSet=rs0 # note that architecture: replicaset
      authKeysDbName: authentication
      authUrl: mongodb://mongodb-headless:27017/?replicaSet=rs0 # note that architecture: replicaset

    managedByConfigPod:
      enabled: true

    sctplb:
      deploy: false # If enabled then deploy sctp pod
      ngapp:
        externalIp: {{ core.amf.ip }}
        port: 38412

    upfadapter:
      deploy: false # If enabled then deploy upf adapter pod

    metricfunc:
      deploy: true
      cfgFiles:
        metricscfg.yaml:
          configuration:
            controllerFlag: {{ core.closed_loop | default('false') }}
            userAppApiServer:
              addr: "upf"

    # Change AMF config here if required
    # Most of the AMF config comes from Slice APIs but some of the config is
    # directly provided through Helm Charts
    amf:
      ngapp:
        externalIp: {{ core.amf.ip }}
      cfgFiles:
        amfcfg.yaml:
          configuration:
            enableDBStore: true # Store AMF subscribers in the datastore
            networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501 sec. 9.11.3.5
              imsVoPS: 1 # IMS voice over PS session indicator (uinteger, range: 0~1)
            # security:
            #   integrityOrder:
            #     - NIA3
            #     - NIA2
            #     - NIA0
            #   cipheringOrder:
            #     - NEA3
            #     - NEA2
            #     - NEA0

    # SMF config override. Refer to Helm Charts values for more options
    smf:
      cfgFiles:
        smfcfg.yaml:
          configuration:
            enableDBStore: true  # Store SMF subscribers in the datastore
            # staticIpInfo:
            #   - dnn: internet
            #     imsiIpInfo:
            #       imsi-001010100007510: "192.168.100.100"
            #       imsi-001010100007511: "192.168.100.101"
            #       imsi-001010100007512: "192.168.100.102"
            #       imsi-001010100007513: "192.168.100.103"
            #       imsi-001010100007514: "192.168.100.104"

    #pcf:
    #  cfgFiles:
    #    pcfcfg.yaml:
    #      configuration:

    nrf:
      cfgFiles:
        nrfcfg.yaml:
          configuration:
            mongoDBStreamEnable: false    # enable/disable MongoDB stream in NRF
            nfProfileExpiryEnable: true   # If enabled, remove NF profile if no keepalive received
            nfKeepAliveTime: 60           # default timeout for NF profiles

# Override values for omec-sub-provision (subscriber) Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/omec-sub-provision/values.yaml
omec-sub-provision:
  enable: true
  nodeSelectors:
    enabled: false
  # images:
  #   repository: ""
  #   tags:
  #     simapp: #add simapp override image
  resources:
    enabled: false
  config:
    simapp:
      cfgFiles:
        simapp.yaml:
          configuration:
            sub-provision-endpt:
              addr: webui  # subscriber configuration endpoint.
            # Configure Subscriber IMSIs and their security details.
            # You can have any number of subscriber ranges
            # This block is always necessary to establish range(s) of valid IMSIs
            subscribers:
            - ueId-start: "001010100007500"
              ueId-end: "001010100007509"
              plmnId: "00101"
              opc: "981d464c7c52eb6e5036234984ad0bcf"
              op: ""
              key: "5122250214c33e723a5dd523fc145fc0"
              sequenceNumber: "16f3b3f70fc2"
{% set mocn_enabled = (core.get('mocn', {}).get('enabled', false) | bool) %}
{% set mocn_slices = core.get('mocn', {}).get('slices', []) if mocn_enabled else [] %}
{% set mocn_imsis = mocn_slices | map(attribute='imsis') | select('defined') | sum(start=[]) %}
{% set mocn_msisdns = mocn_slices | map(attribute='msisdns') | select('defined') | sum(start=[]) %}
            # Configure Device Groups
            device-groups:
            - name:  "user-group1"
              imsis:
                - "001010100007500"
{% if "001010100007501" not in mocn_imsis %}
                - "001010100007501"
{% endif %}
              msisdns:
                - "msisdn-9000000001"
{% if "msisdn-9000000002" not in mocn_msisdns %}
                - "msisdn-9000000002"
{% endif %}
              ip-domain-name: "pool1"
              ip-domains:
                - dnn: internet
                  dns-primary: "8.8.8.8"        # Value is sent to UE
                  mtu: 1460                     # Value is sent to UE when PDU Session Established
                  ue-ip-pool: {{ core.upf.default_upf.ue_ip_pool }}  # IP address pool for subscribers
                  ue-dnn-qos:
                    dnn-mbr-downlink: 1000      # UE level downlink QoS (Maximum bit rate per UE)
                    dnn-mbr-uplink:   1000      # UE level uplink QoS (Maximum bit rate per UE)
                    bitrate-unit: Mbps          # Unit for above QoS rates
                    traffic-class:              # Default bearer QCI/ARP (not used in 5G)
                      name: "platinum"
                      qci: 9
                      arp: 6
                      pdb: 300
                      pelr: 6
              site-info: "enterprise"
{% for mslice in mocn_slices %}
{% set mupf = (core.upf.additional_upfs | default({})).get(mslice.upf_key | string, {}) %}
            - name:  "{{ mslice.device_group | default('user-group-' ~ (mslice.upf_key | string)) }}"
              imsis:
{% for mimsi in (mslice.imsis | default([])) %}
                - "{{ mimsi }}"
{% endfor %}
              msisdns:
{% for mmsisdn in (mslice.msisdns | default(['msisdn-9000000002'])) %}
                - "{{ mmsisdn }}"
{% endfor %}
              ip-domain-name: "{{ mslice.pool_name | default('pool-' ~ (mslice.upf_key | string)) }}"
              ip-domains:
                - dnn: {{ mslice.dnn | default('internet') }}
                  dns-primary: "8.8.8.8"
                  mtu: 1460
                  ue-ip-pool: {{ mslice.ue_ip_pool | default(mupf.ue_ip_pool) }}
                  ue-dnn-qos:
                    dnn-mbr-downlink: 1000
                    dnn-mbr-uplink:   1000
                    bitrate-unit: Mbps
                    traffic-class:
                      name: "platinum"
                      qci: 9
                      arp: 6
                      pdb: 300
                      pelr: 6
              site-info: "enterprise"
{% endfor %}
            # UPF allocates IP address if there is only 1 device-group
            # SMF allocates IP address if there is >1 device-group

            # Configure Network Slices
            network-slices:
            - name: "default"      # can be any unique slice name
              slice-id:            # must match with slice configured in gNB, UE
                sd: "010203"
                sst: 1
              site-device-group:
              - "user-group1"   # All UEs in this device-group are assigned to this slice
              # Application filters control what each user can access.
              # Default, allow access to all applications
              application-filtering-rules:
              - rule-name: "ALLOW-ALL"
                priority: 250
                action: "permit"
                endpoint: "0.0.0.0/0"
                traffic-class:
                  qci: 9
                  arp: 6
              site-info:
                # Provide gNBs and UPF details and also PLMN for the site
                gNodeBs:
                - name: "gnb1"
                  tac: 1
                - name: "gnb2"
                  tac: 2
                plmn:
                  mcc: "001"
                  mnc: "01"
                site-name: "enterprise"
                upf:
                  upf-name: "upf"  # associated UPF for this slice. One UPF per Slice.
                  upf-port: 8805
{% for mslice in mocn_slices %}
{% set mupf = (core.upf.additional_upfs | default({})).get(mslice.upf_key | string, {}) %}
            - name: "{{ mslice.name | default('slice-upf-' ~ (mslice.upf_key | string)) }}"
              slice-id:
                sd: "{{ mslice.sd | default('010204') }}"
                sst: {{ mslice.sst | default(1) }}
              site-device-group:
              - "{{ mslice.device_group | default('user-group-' ~ (mslice.upf_key | string)) }}"
              application-filtering-rules:
              - rule-name: "ALLOW-ALL"
                priority: 250
                action: "permit"
                endpoint: "0.0.0.0/0"
                traffic-class:
                  qci: 9
                  arp: 6
              site-info:
                gNodeBs:
                - name: "gnb1"
                  tac: 1
                - name: "gnb2"
                  tac: 2
                plmn:
                  mcc: "001"
                  mnc: "01"
                site-name: "enterprise"
                upf:
                  upf-name: "{{ mslice.upf_name | default(mupf.hostname | default('upf.aether-upf-' ~ (mslice.upf_key | string))) }}"
                  upf-port: {{ mslice.upf_port | default(8805) }}
{% endfor %}

# Override values for omec-user-plane Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/bess-upf/values.yaml
omec-user-plane:
  enable: true
  nodeSelectors:
    enabled: true
  resources:
    enabled: {{ (core.upf.mode == 'dpdk') | ternary('true', 'false') }}
  # images:
  #   repository: ""
  #   tags:
  #     bess: <bess image tag>
  #     pfcpiface: <pfcp image tag>
  #     tools: <aether-pod-init image tag>
  config:
    upf:
      name: "aether-upf"
      privileged: {{ (core.upf.mode == 'dpdk') | ternary('true', 'false') }}
      sriov:
        enabled: {{ (core.upf.mode == 'dpdk') | ternary('true', 'false') }}
      hugepage:
        enabled: {{ (core.upf.mode == 'dpdk') | ternary('true', 'false') }}
      routes:
        - to: {{ ansible_default_ipv4.address }}
          via: 169.254.1.1
      ran:
        subnet: {{ ran_subnet }} # Subnet for the gNB network
      access:
        ipam: static
        cniPlugin: {{ 'vfioveth' if core.upf.mode == 'dpdk' else 'macvlan' }}
        iface: {{ core.data_iface }}
{% if core.upf.mode == 'dpdk' %}
        resourceName: {{ core.upf.access_resource_name | default('intel.com/intel_sriov_vfio_access') | to_json }}
{% endif %}
        gateway: {{ access_gw }}
        ip: {{ access_ip }}
      core:
        ipam: static
        cniPlugin: {{ 'vfioveth' if core.upf.mode == 'dpdk' else 'macvlan' }}
        iface: {{ core.data_iface }}
{% if core.upf.mode == 'dpdk' %}
        resourceName: {{ core.upf.core_resource_name | default('intel.com/intel_sriov_vfio_core') | to_json }}
{% endif %}
        gateway: {{ core_gw }}
        ip: {{ core_ip }}
      closedLoop: {{ core.closed_loop | default('false') | lower }}
      cfgFiles:
        upf.jsonc:
          mode: {{ core.upf.mode }}
          hwcksum: true
          log_level: "info"
          measure_upf: true
          measure_flow: true
          gtppsc: true                   # Extension header enabled in 5G.
          # DDP is INTEL NIC's specific feature (supported in E810 series)
          # which helps to improve UPF packet processing performance.
          # For more details on DDP feature and its usage please refer
          # "https://www.intel.com/content/www/us/en/download/19660/intel-ethernet-800-series-dynamic-device-personalization-ddp-for-telecommunication-comms-package.html"
          ddp: false                     # this parameter is only used/relevant when deploying the UPF in 'dpdk' mode
          cpiface:
            hostname: "upf"
            #http_port: "8080"
            enable_ue_ip_alloc: true    # If true, UPF allocates address from following pool
            ue_ip_pool: {{ core.upf.default_upf.ue_ip_pool }} # IP pool used UEs if enable_ue_ip_alloc=true
          slice_rate_limit_config:       # Slice-level rate limiting
            # Uplink
            n6_bps: 10000000000          # 10Gbps
            n6_burst_bytes: 12500000     # 10ms * 10Gbps
            # Downlink
            n3_bps: 10000000000          # 10Gbps
            n3_burst_bytes: 12500000     # 10ms * 10Gbps
